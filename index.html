<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<title>心動動｜喂食記錄🐾</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Huninn", sans-serif;
  background:#fffaf4;
  color:#ae4b42;
  min-height:100vh;
  padding:40px 20px 80px;
}

/* 背景裝飾 */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,#ffe8e8 0%,transparent 30%),
    radial-gradient(circle at bottom right,#fff1c9 0%,transparent 30%);
  opacity:0.7;
  z-index:-1;
}

/* header */

.site-header {
  text-align:center;
  margin-bottom:20px;
}

.site-header h1 {
  margin-bottom:10px;
}

.site-header p {
  opacity:0.7;
}


/* tabs */

.pet-tabs {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:35px;
}

button {
  padding: 8px 12px;
  border-color: #fff;
  border-radius: 12px;
  margin: 2px;
  background: #f7ff7f7;
  font-family: "Huninn", sans-serif;
  font-size: 14px;
  transition: 0.2s;
  cursor:pointer;
}

button:hover {
  transform:translateY(-1px);
  background: #f0d9dc;
  border-color: #e092a8;
}

button.active {
  background:#ffd9d9;
}

/* content */

#pet-content{
  max-width:900px;
  margin:auto;
}

/* card */

.pet-card{
  background:white;
  border-radius:28px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  display:none;
  animation:fade 0.3s ease;
}

.pet-card.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* pet header */

.pet-header{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:30px;
}

.pet-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff3e4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.pet-header h2{
  font-size:32px;
  margin-bottom:5px;
}

.pet-type{
  display:inline-block;
  background:#f4eee8;
  padding:4px 10px;
  border-radius:999px;
  font-size:13px;
  opacity:0.8;
}

.pet-group {
  display: inline-block;
  background: #fff0dc;
  padding: 12px;
  border-radius: 12px;
  font-size: 18px;
  opacity: 0.8;
}

.group-title {
  margin-bottom: 6px;
}

/* info block */

.info-block{
  background:#fffaf7;
  border: 1px solid #f5e7e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.info-block h3 {
  margin-bottom:15px;
  font-size:20px;
}

.card h2 {
  margin-bottom: 12px;
}

/* food */

.food-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.food-item{
  background:white;
  padding:10px 14px;
  border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  font-size:15px;
}

/* combo */

.combo-box{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:12px;
}

.plus{
  font-size:22px;
  opacity:0.5;
}

/* tags */

.tag-list{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.tag{
  background:#ffe8a3;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
}

/* memo */

.memo-text{
  line-height:1.8;
}

/* empty */

.empty{
  opacity:0.5;
}

/* mobile */

@media(max-width:700px){

  .site-header h1{
    font-size:30px;
  }

  .pet-card{
    padding:22px;
  }

  .pet-header h2{
    font-size:26px;
  }

}

</style>
</head>

<body>

<header class="site-header">

  <h1>喂食記錄🐾</h1>

  <p>
    沃的貓貓狗狗都在吃什麼？
  </p>

</header>

<nav class="pet-tabs" id="pet-tabs">
  <div class="pet-group">
    <div class="group-title">
      🐈咪
    </div>
    <div class="group-buttons">
      <button data-sheet="芝麻糕" onclick="switchSheet('芝麻糕')">芝麻糕</button>
      <button data-sheet="南瓜派" onclick="switchSheet('南瓜派')">南瓜派</button>
      <button data-sheet="溪溪咪" onclick="switchSheet('溪溪咪')">溪溪咪</button>
    </div>
  </div>
  <div class="pet-group">
    <div class="group-title">
      🐕沃
    </div>
    <div class="group-buttons">
      <button data-sheet="巧克力珍奶" onclick="switchSheet('巧克力珍奶')">巧克力珍奶</button>
      <button data-sheet="芋泥肉鬆吐司" onclick="switchSheet('芋泥肉鬆吐司')">芋泥肉鬆吐司</button>
    </div>
  </div>
</nav>

<main id="pet-content"></main>

<script>
const SHEET_ID = "1Ngle-qFpZJdjYtrWxJ3frfiHcAJMFIqUDN4cgQ2o-P4";

let currentSheet = localStorage.getItem("currentSheet") || "芝麻糕";

function getURL(sheetName) {
  return `https://opensheet.elk.sh/${SHEET_ID}/${sheetName}`;
}

async function loadData() {

  const response =
    await fetch(getURL(currentSheet));

  const data =
    await response.json();

  renderPet(data);

}


function renderPet(data) {

  const content =
    document.getElementById("pet-content");

  let love = [];
  let neutral = [];
  let dislike = [];
  let trying = [];

  data.forEach(item => {

    if (item.trying === "TRUE") {

      trying.push(item.dish);

    }

    else if (item.preference === "❤︎") {

      love.push(item.dish);

    }

    else if (item.preference === "▲") {

      neutral.push(item.dish);

    }

    else if (item.preference === "✖") {

      dislike.push(item.dish);

    }

  });

  content.innerHTML = `
  
  <section class="pet-card active">

    <h2>${currentSheet}</h2>

    <div class="info-block">
      <h3>❤️ 喜歡</h3>
      <div class="food-list">
        ${love.map(food =>
          `<div class="food-item">${food}</div>`
        ).join("")}
      </div>
    </div>

    <div class="info-block">
      <h3>▲ 普通</h3>
      <div class="food-list">
        ${neutral.map(food =>
          `<div class="food-item">${food}</div>`
        ).join("")}
      </div>
    </div>

    <div class="info-block">
      <h3>❌ 挑食</h3>
      <div class="food-list">
        ${dislike.map(food =>
          `<div class="food-item">${food}</div>`
        ).join("")}
      </div>
    </div>

    <div class="info-block">
      <h3>❔ 測試中</h3>
      <div class="food-list">
        ${trying.map(food =>
          `<div class="food-item">${food}</div>`
        ).join("")}
      </div>
    </div>

  </section>

  `;
}



function switchSheet(name) {

  currentSheet = name;

  localStorage.setItem(
    "currentSheet",
    name
  );

  updateActiveTabs();

  loadData();

}

function updateActiveTabs() {

  document
    .querySelectorAll("[data-sheet]")
    .forEach(btn => {

      btn.classList.remove("active");

      if (
        btn.dataset.sheet === currentSheet
      ) {
        btn.classList.add("active");
      }

    });
}


updateActiveTabs();
loadData();

</script>

</body>
</html>
