<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<title>心動動｜喂食記錄🐾</title>

<style>

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body{
  font-family: "Huninn", sans-serif;
  background: #fffaf4;
  color: #ae4b42;
  min-height: 100vh;
  padding: 40px 20px 80px;
}

/* 背景裝飾 */

body::before{
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top left,#ffe8e8 0%,transparent 30%),
    radial-gradient(circle at bottom right,#fff1c9 0%,transparent 30%);
  opacity: 0.7;
  z-index: -1;
}

/* header */

.site-header {
  text-align: center;
  margin-bottom: 20px;
}

.site-header h1 {
  margin-bottom: 10px;
}

.site-header p {
  opacity: 0.7;
}


/* tabs */

.pet-tabs {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 35px;
}

button {
  padding: 8px 12px;
  border: 2px outset #fff;
  border-radius: 12px;
  margin: 2px;
  background: #f7f7f7;
  font-family: "Huninn", sans-serif;
  font-size: 14px;
  transition: 0.2s;
  cursor: pointer;
}

button:hover {
  transform: translateY(-2px);
  background: #f0d9dc;
  border-color: #e092a8;
}

button.active {
  background: #ffd9d9;
  border-color: #e092a8;
}

/* content */

#pet-content{
  max-width: 900px;
  margin: auto;
}

/* card */

.pet-card{
  background: white;
  border-radius: 28px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  display: none;
  animation: fade 0.3s ease;
}

.pet-card.active{
  display: block;
}

@keyframes fade{
  from{
    opacity: 0;
    transform: translateY(10px);
  }
  to{
    opacity: 1;
    transform: translateY(0);
  }
}

/* pet header */

.pet-header{
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 30px;
}

.pet-icon{
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #fff3e4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
}

.pet-header h2{
  font-size: 32px;
  margin-bottom: 5px;
}

.pet-type{
  display: inline-block;
  background: #f4eee8;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0.8;
}

.pet-group {
  display: inline-block;
  background: #fff0dc;
  padding: 12px;
  border-radius: 12px;
  font-size: 18px;
  opacity: 0.8;
}

.group-title {
  margin-bottom: 6px;
}

/* info block */

.info-block{
  background: #fffaf7;
  border: 1px solid #f5e7e3;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
}

.info-block h3 {
  margin-bottom: 15px;
  font-size: 20px;
}

.card h2 {
  margin-bottom: 12px;
}

/* food */

.food-list{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.food-item{
  background: white;
  padding: 10px 14px;
  border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  font-size: 15px;
}

/* type groups */

.type-group{
  margin-bottom: 14px;
}

.type-title{
  font-size: 16px;
  margin-bottom: 8px;
  opacity: 0.85;
}

.type-items{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* combo */

.combo-box{
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.plus{
  font-size: 22px;
  opacity: 0.5;
}

/* tags */

.tag-list{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.tag{
  background: #ffe8a3;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
}

/* memo */

.memo-text{
  line-height: 1.8;
}

/* empty */

.empty{
  opacity: 0.5;
}

/* mobile */

@media(max-width:700px){

  .site-header h1{
    font-size: 30px;
  }

  .pet-card{
    padding: 22px;
  }

  .pet-header h2{
    font-size: 26px;
  }

}

.food-item{
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,90vw);
  background:white;
  border-radius:20px;
  padding:24px;
}

.modal-divider{
  border:none;
  border-top:1px solid #f0dfd8;
  margin:16px 0;
}

.status-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

</style>
</head>

<body>

<header class="site-header">

  <h1>喂食記錄🐾</h1>

  <p>
    沃的貓貓狗狗都在吃什麼？
  </p>

</header>

<nav class="pet-tabs" id="pet-tabs">
  <div class="pet-group">
    <div class="group-title">
      🐈咪
    </div>
    <div class="group-buttons">
      <button data-pet="芝麻糕" data-type="cat">芝麻糕</button>
      <button data-pet="南瓜派" data-type="cat">南瓜派</button>
      <button data-pet="溪溪咪" data-type="cat">溪溪咪</button>
    </div>
  </div>
  <div class="pet-group">
    <div class="group-title">
      🐕沃
    </div>
    <div class="group-buttons">
      <button data-pet="巧克力珍奶" data-type="dog">巧克力珍奶</button>
      <button data-pet="芋泥肉鬆吐司" data-type="dog">芋泥肉鬆吐司</button>
    </div>
  </div>
</nav>

<div id="foodModal" class="modal">
  <div class="modal-box">
    <div id="modalContent">
    </div>
  </div>
</div>

<main id="pet-content"></main>

<script>
let currentFoods = [];
    
const SHEET_ID = "1Ngle-qFpZJdjYtrWxJ3frfiHcAJMFIqUDN4cgQ2o-P4";

let currentPet = localStorage.getItem("currentPet") || "芝麻糕";

function getURL(sheetName) {
  return `https://opensheet.elk.sh/${SHEET_ID}/${sheetName}`;
}

function getPetType() {
  const activeBtn = document.querySelector(`[data-pet="${currentPet}"]`);
  return activeBtn ? activeBtn.dataset.type : "cat";
}

async function loadData() {
  try {
    const response = await fetch(getURL(getSheetName()));
    if (!response.ok) {
      throw new Error("Failed to load sheet");
    }
    const data = await response.json();
    renderPet(data);
  } catch (error) {
    renderError();
  }
}

function getSheetName() {
  const type = getPetType();
  return type === "cat" ? "貓食" : "狗食";
}

function getPetData() {
  const saved = localStorage.getItem("petData");
  return saved ? JSON.parse(saved) : {};
}

function getFoodStatus(foodName) {
  const petData = getPetData();
  const pet = petData[currentPet] || {};
  return pet[foodName]?.status ?? "trying";
}

function getTestedStars(foodName) {
  const petData = getPetData();
  const pet = petData[currentPet] || {};
  return pet[foodName]?.testedStars || [];
}

function getPetIcon() {
  return getPetType() === "cat" ? "😺" : "🐶";
}

function groupByType(items) {
  const grouped = {};
  items.forEach(item => {
    const type = item.type || "其他";
    if (!grouped[type]) grouped[type] = [];
    grouped[type].push(item.dish);
  });
  return grouped;
}

function renderFoodGroups(items) {
  if (!items.length) {
    return `<div class="empty">還沒找到沃</div>`;
  }

  const grouped = groupByType(items);

  return Object.entries(grouped).map(([type, dishes]) => `
    <div class="type-group">
      <div class="type-title">${type}</div>
      <div class="type-items">
        ${items
          .filter(item => item.type === type)
          .map(item => `
            <div class="food-item" onclick="openFoodModal('${item.dish}')" >
      ${item.dish}
    </div>
  `)
  .join("")
}
      </div>
    </div>
  `).join("");
}

function renderPet(data) {
  const content = document.getElementById("pet-content");
  currentFoods = data;

  let love = [];
  let neutral = [];
  let dislike = [];
  let trying = [];

  data.forEach(item => {
    const status = getFoodStatus(item.dish);

    if (status === "love") {
      love.push(item);
    } else if (status === "neutral") {
      neutral.push(item);
    } else if (status === "dislike") {
      dislike.push(item);
    } else {
      trying.push(item);
    }
  });

  content.innerHTML = `
  <section class="pet-card active">
    <div class="pet-header">
      <div class="pet-icon">
        ${getPetIcon()}
      </div>
      <div>
        <h2>${currentPet}</h2>
      </div>
    </div>

    <div class="info-block">
      <h3>❤️ 喜歡</h3>
      <div>
        ${renderFoodGroups(love)}
      </div>
    </div>

    <div class="info-block">
      <h3>▲ 普通</h3>
      <div>
        ${renderFoodGroups(neutral)}
      </div>
    </div>

    <div class="info-block">
      <h3>❌ 挑食</h3>
      <div>
        ${renderFoodGroups(dislike)}
      </div>
    </div>

    <div class="info-block">
      <h3>❔ 測試中</h3>
      <div>
        ${renderFoodGroups(trying)}
      </div>
    </div>
  </section>
  `;
}

function renderError() {
  document.getElementById("pet-content").innerHTML = `
    <section class="pet-card active">
      <div class="info-block">
        <h3>找不到沃</h3>
        <div class="empty">等一下下</div>
      </div>
    </section>
  `;
}

function renderStars(maxStar, testedStars) {
  let html = "";
  for(let i = 1; i <= maxStar; i++) {
    html += testedStars.includes(i)
      ? "✦ "
      : "⟡ ";
  }

  return html;
}

function updateActiveTabs() {
  document.querySelectorAll("[data-pet]").forEach(btn => {
    btn.classList.remove("active");
    if (btn.dataset.pet === currentPet) {
      btn.classList.add("active");
    }
  });
}

document.querySelectorAll("[data-pet]").forEach(btn => {
  btn.addEventListener("click", () => {
    currentPet = btn.dataset.pet;
    localStorage.setItem("currentPet", currentPet);
    updateActiveTabs();
    loadData();
  });
});

function openFoodModal(foodName){
  
  const food =
    currentFoods.find(
      item => item.dish === foodName
    );

  const testedStars = getTestedStars(food.dish);
  
  if(!food) return;

  document
    .getElementById("modalContent")
    .innerHTML = `

      <h2>${food.dish}</h2>

      ${food.type ? `<p>類型：${food.type}</p>` : ""}
      ${food.level ? `<p>等級：${food.level}</p>` : "等級： -"}
      ${food.period ? `<p>活躍時期：${food.period}</p>` : ""}
      ${food.time_range ? `<p>時間段：${food.time_range}</p>` : ""}
      ${food.weather ? `<p>天氣：${food.weather}</p>` : ""}
      ${food.location ? `<p>地點：${food.location}</p>` : ""}
      ${food.ingredients ? `<p>食材：${food.ingredients}</p>` : ""}
      
      <p>已測試：${renderStars(Number(food.star),testedStars)}
      
      <hr class="modal-divider">

        <div class="status-buttons">

          <button onclick="setFoodStatus('${food.dish}', 'love')">
            ❤️ 喜歡
          </button>

          <button onclick="setFoodStatus('${food.dish}', 'dislike')">
            ❌ 挑食
          </button>

          <button onclick="setFoodStatus('${food.dish}', 'neutral')">
            ▲ 無感
          </button>

          <button onclick="setFoodStatus('${food.dish}', 'trying')">
            ❔ 測試中
          </button>

        </div>

        <hr class="modal-divider">

      `;
      
      

  document
    .getElementById("foodModal")
    .classList
    .add("show");

}

document
  .getElementById("foodModal")
  .addEventListener(
    "click",
    e => {

      if(
        e.target.id === "foodModal"
      ){

        e.currentTarget
          .classList
          .remove("show");

      }

    }
  );


updateActiveTabs();
loadData();
</script>

</body>
</html>
